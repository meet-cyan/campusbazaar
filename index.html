<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manipal Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#28352d;
    --bg-2:#1f2922;
    --paper:#f6efdd;
    --paper-2:#efe6cd;
    --ink:#2a2420;
    --ink-soft:#6b5f52;
    --line:#d9cca8;
    --gold:#d8a93a;
    --gold-ink:#5c4415;
    --c-buy:#c98a2c;
    --c-flatmate:#2f8f88;
    --c-flat:#a15a2a;
    --c-cab:#c1542c;
    --c-help:#7a4e82;
    --c-lost:#3572a5;
    --c-events:#4c8f4a;
    --c-other:#7d7768;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.03), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--paper);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}

  header{
    padding:32px 16px 20px;
    text-align:center;
    border-bottom:2px dashed rgba(246,239,221,0.25);
    margin-bottom:20px;
  }
  header .pin{
    font-size:24px;display:block;margin-bottom:4px;
    animation: pinDrop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pinDrop{
    0%{transform:translateY(-44px) rotate(-20deg);opacity:0;}
    65%{transform:translateY(5px) rotate(4deg);opacity:1;}
    100%{transform:translateY(0) rotate(0deg);}
  }
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:2.2rem;
    margin:0;
    letter-spacing:0.3px;
    color:var(--paper);
  }
  .tagline{
    font-family:'Zilla Slab',serif;
    font-weight:500;
    font-style:italic;
    font-size:1.05rem;
    color:var(--gold);
    margin:8px 0 0;
  }
  .rotator{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:#b9c4ba;
    margin:10px auto 0;
    max-width:520px;
    line-height:1.5;
    min-height:1.4em;
  }
  .rotator .cursor{
    display:inline-block;width:7px;
    background:var(--gold);
    animation: blink 0.9s steps(1) infinite;
    margin-left:1px;
  }
  @keyframes blink{50%{opacity:0;}}
  .stats-row{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:#8fa197;
    margin-top:14px;
    letter-spacing:0.03em;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    background:var(--bg-2);
    color:#cfd8d1;
    border:1px solid rgba(246,239,221,0.2);
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab.active{
    background:var(--gold);
    color:var(--gold-ink);
    border-color:var(--gold);
    font-weight:600;
  }

  .toolbar{display:flex;gap:8px;margin-bottom:18px;}
  .search-input{
    flex:1;
    background:var(--bg-2);
    border:1px solid rgba(246,239,221,0.2);
    color:var(--paper);
    padding:10px 12px;
    border-radius:6px;
    font-family:'Work Sans',sans-serif;
    font-size:0.9rem;
  }
  .search-input::placeholder{color:#93a096;}
  .btn-pin{
    background:var(--gold);
    color:var(--gold-ink);
    border:none;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-surprise{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:10px 14px;
    border-radius:6px;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    white-space:nowrap;
  }

  .filter-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .filter-bar select{
    flex:1 1 140px;
    background:var(--bg-2);
    border:1px solid rgba(246,239,221,0.2);
    color:var(--paper);
    padding:8px 10px;
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
  }

  .panel{
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:18px;
    margin-bottom:24px;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    display:none;
  }
  .panel.open{display:block;animation:drop .18s ease-out;}
  @keyframes drop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .panel h3{font-family:'Zilla Slab',serif;margin:0 0 4px;font-size:1.2rem;}
  .panel .hint{font-size:0.78rem;color:var(--ink-soft);margin:0 0 14px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  textarea, .field input, .field select{
    width:100%;
    border:1px solid var(--line);
    background:#fffdf7;
    color:var(--ink);
    padding:9px 10px;
    border-radius:5px;
    font-family:'Work Sans',sans-serif;
    font-size:0.9rem;
  }
  textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .imgpicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .thumb{width:52px;height:52px;border-radius:5px;object-fit:cover;border:1px solid var(--line);}
  .filelabel{
    border:1px dashed var(--line);
    border-radius:5px;
    padding:14px;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:center;
    cursor:pointer;
    width:100%;
  }
  .panel-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:9px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;
  }
  .btn-solid{
    background:var(--ink);color:var(--paper);border:none;
    padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:0.85rem;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:22px;
    padding:6px 2px 2px;
  }
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
    padding:14px 14px 12px;
    position:relative;
    box-shadow:0 8px 16px rgba(0,0,0,0.28), 0 2px 3px rgba(0,0,0,0.15);
    transform:rotate(var(--rot,0deg));
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:pointer;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-9px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe8a3, var(--gold) 60%, var(--gold-ink));
    box-shadow:0 3px 4px rgba(0,0,0,0.4);
  }
  .tape{
    position:absolute;top:8px;right:-6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    color:#fff;
    padding:3px 10px 3px 8px;
    border-radius:2px 0 0 2px;
  }
  .card img.attach{
    width:100%;
    border-radius:4px;
    margin:8px 0;
    max-height:160px;
    object-fit:cover;
    border:1px solid var(--line);
  }
  .card h4{font-family:'Zilla Slab',serif;font-size:1.05rem;margin:10px 0 4px;padding-right:20px;}
  .card p.desc{font-size:0.85rem;line-height:1.45;color:#4a4038;margin:0 0 10px;white-space:pre-wrap;}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    border-top:1px dashed var(--line);
    padding-top:8px;
  }
  .actions{display:flex;flex-wrap:wrap;gap:6px;}
  .actions a, .actions button{
    flex:1 1 auto;
    text-align:center;
    text-decoration:none;
    font-size:0.75rem;
    font-weight:600;
    padding:7px 8px;
    border-radius:5px;
    border:none;
    cursor:pointer;
  }
  .a-tg{background:#2AABEE;color:#fff;}
  .a-wa{background:#2f8f5d;color:#fff;}
  .a-call{background:var(--ink);color:var(--paper);}
  .a-del{background:transparent;border:1px solid #c1542c!important;color:#c1542c;}
  .a-report{background:transparent;border:1px solid var(--line)!important;color:var(--ink-soft);flex:0 0 auto!important;padding:7px 10px!important;}
  .a-report.reported{color:#c1542c;border-color:#c1542c!important;}
  .flag-badge{
    position:absolute;top:-9px;left:10px;
    background:#c1542c;color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;text-transform:uppercase;
    padding:3px 7px;border-radius:2px;
  }
  .admin-bar{text-align:center;padding:26px 0 6px;}
  .admin-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;color:#6d7a71;
    background:none;border:none;cursor:pointer;text-decoration:underline;
  }
  .admin-on{color:var(--gold);}

  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    background:var(--paper-2);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:2px 8px;
    border-radius:10px;
  }
  .tag.price{color:var(--gold-ink);font-weight:600;border-color:var(--gold);}
  .tag.seller{color:#2f8f88;border-color:#2f8f88;}
  .featured-badge{
    position:absolute;top:-9px;right:10px;
    background:var(--gold);color:var(--gold-ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;text-transform:uppercase;
    padding:3px 7px;border-radius:2px;
  }
  .a-feature{background:transparent;border:1px solid var(--gold)!important;color:var(--gold-ink);flex:0 0 auto!important;padding:7px 10px!important;}
  .a-feature.on{background:var(--gold);color:var(--gold-ink);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:#9fada4;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:var(--gold-ink);
    padding:10px 18px;border-radius:20px;font-size:0.85rem;font-weight:600;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    font-family:'IBM Plex Mono',monospace;
    z-index: 1000;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width: 600px) {
    .toolbar{flex-wrap:wrap;}
    .search-input{width:100%;}
    .btn-pin, .btn-surprise{flex:1;}
  }

  /* Required Field Indicator */
  .req {
    color: #e63946;
    font-weight: bold;
    margin-left: 2px;
  }

  /* Base Form Field Stacking & Spacing */
  .form-group {
    margin-bottom: 12px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .form-row > div {
    flex: 1 1 100%; /* Default to full width on mobile */
  }

  /* Ensure inputs take full width */
  input[type="text"],
  input[type="number"],
  select,
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
    padding: 10px 12px;
  }

  /* 2 columns on desktop/tablet, 1 column on phone */
  @media (min-width: 600px) {
    .form-row > div {
      flex: 1;
    }
  }
    /* Contact Section Styling */
  .contact-section {
    background: var(--paper-2);
    border: 1px dashed var(--line);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .contact-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .contact-header label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0;
  }
  .contact-hint {
    font-size: 0.72rem;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .contact-row {
    align-items: center;
  }
  .contact-divider {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: bold;
    color: var(--gold-ink);
    background: var(--gold);
    padding: 4px 8px;
    border-radius: 12px;
    align-self: center;
    margin-top: 10px;
  }
  @media (max-width: 600px) {
    .contact-divider {
      margin: 4px 0;
      align-self: center;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="pin">📌</span>
    <span class="kicker">est. because group chats forget</span>
    <h1>Manipal Board</h1>
    <p class="tagline">Telegram buries it. We pin it.</p>
    <p class="rotator" id="rotator"><span id="rotatorText"></span><span class="cursor">&nbsp;</span></p>
    <p class="stats-row" id="statsRow">Loading posts...</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <input class="search-input" id="search" placeholder="Search posts…">
    <button class="btn-surprise" id="surpriseBtn">🎲 Surprise me</button>
    <button class="btn-pin" id="toggleBtn">+ Pin a post</button>
  </div>

  <div class="filter-bar">
    <select id="sortSel">
      <option value="newest">Sort: Newest first</option>
      <option value="featured">Sort: Featured first</option>
      <option value="price-desc">Sort: Price high → low</option>
      <option value="price-asc">Sort: Price low → high</option>
      <option value="az">Sort: A → Z</option>
    </select>
    <select id="dealerSel">
      <option value="all">Dealer: All</option>
    </select>
    <select id="sizeSel">
      <option value="all">Size: All</option>
    </select>
  </div>

  <!-- NEW POST PANEL -->
  <div id="panel" class="panel">
    <div class="panel-content">
      <h3>📌 Pin a Post</h3>
      
      <div class="form-group">
        <label>DETAILS / DESCRIPTION <span class="req">*</span></label>
        <textarea id="rawMsg" rows="3" placeholder="Paste full post or message here..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>CATEGORY <span class="req">*</span></label>
          <select id="category">
            <option value="buy-sell">💰 Buy & Sell</option>
            <option value="flatmate">🔍 Find Flatmates</option>
            <option value="flat">🏠 Flats for Rent</option>
            <option value="cab">🚗 Find Cab Mate</option>
            <option value="help">🆘 Ask Help</option>
            <option value="lost">👮 Lost & Found</option>
            <option value="events">🎤 Free Events</option>
            <option value="other">🗂️ Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>TITLE <span class="req">*</span></label>
          <input type="text" id="title" placeholder="e.g. Study table for sale">
        </div>
      </div>
      <!-- CONTACT OPTIONS SECTION -->
      <div class="contact-section">
        <div class="contact-header">
          <label>CONTACT METHOD <span class="req">*</span></label>
          <span class="contact-hint">(Fill at least one)</span>
        </div>

        <div class="form-row contact-row">
          <div class="form-group">
            <label for="tglink">TELEGRAM HANDLE</label>
            <input type="text" id="tglink" placeholder="e.g. @username">
          </div>

          <div class="contact-divider">OR</div>

          <div class="form-group">
            <label for="phone">PHONE / WHATSAPP</label>
            <input type="text" id="phone" placeholder="e.g. 9876543210">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>PRICE (IN ₹)</label>
          <input type="number" id="price" placeholder="e.g. 1200">
        </div>

        <div class="form-group">
          <label>SIZE / VARIANT</label>
          <input type="text" id="size" placeholder="e.g. M, UK 9, 3BHK">
        </div>
      </div>

      <div class="form-group">
        <label>SELLER / DEALER NAME</label>
        <input type="text" id="seller" placeholder="Your name or alias">
      </div>

      <div class="form-group">
        <label>PHOTOS (UP TO 3)</label>
        <div id="imgDrop" class="img-drop">TAP TO ADD IMAGES</div>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none">
        <div id="imgPreview" class="img-preview"></div>
      </div>

      <div style="font-size: 11px; color: #777; margin-bottom: 12px;">
        <span class="req">*</span> Fill either Telegram or Phone to enable contact buttons.
      </div>

      <div class="panel-actions">
        <button id="cancelBtn" class="btn-ghost">Cancel</button>
        <button id="postBtn" class="btn-solid">Pin it</button>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">Nothing pinned here yet — be the first.</div>

  <div class="admin-bar">
    <button class="admin-link" id="adminLink">Admin</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase Module & App Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, increment 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAMt38y6wPkAYLRfn4XL1p2yAmKVSoiKIo",
    authDomain: "manipal-board.firebaseapp.com",
    projectId: "manipal-board",
    storageBucket: "manipal-board.firebasestorage.app",
    messagingSenderId: "610714954515",
    appId: "1:610714954515:web:af3e8aac1c80165128c8e6",
    measurementId: "G-F0VYTZ9D56"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const itemsCollection = collection(db, "items");

  const CATS = {
    'buy-sell':  {label:'Buy & Sell',     emoji:'💰', color:'var(--c-buy)'},
    'flatmate':  {label:'Find Flatmates', emoji:'🔍', color:'var(--c-flatmate)'},
    'flat':      {label:'Flats for Rent', emoji:'🏠', color:'var(--c-flat)'},
    'cab':       {label:'Find Cab Mate',  emoji:'🚗', color:'var(--c-cab)'},
    'help':      {label:'Ask Help',       emoji:'🆘', color:'var(--c-help)'},
    'lost':      {label:'Lost & Found',   emoji:'👮', color:'var(--c-lost)'},
    'events':    {label:'Free Events',    emoji:'🎤', color:'var(--c-events)'},
    'other':     {label:'Other',          emoji:'🗂️', color:'var(--c-other)'}
  };

  const FLAG_THRESHOLD = 3;
  const ADMIN_CODE = 'board-admin-2026';

  let items = [];
  let mine = JSON.parse(localStorage.getItem('my_posted_ids_v1') || '[]');
  let reported = JSON.parse(localStorage.getItem('reported_ids_v1') || '[]');
  let isAdmin = false;
  let activeCat = 'all';
  let pendingImages = [];

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function whatsappLink(phone){
    let n = phone.replace(/\D/g,'');
    if(n.length===10) n = '91'+n;
    return 'https://wa.me/'+n;
  }

  function timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }

  // Real-time synchronization with Firebase
  onSnapshot(itemsCollection, (snapshot) => {
    items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  }, (error) => {
    console.error("Firestore error:", error);
    toast("Database connection failed");
  });

  function buildTabs(){
    const tabsEl = document.getElementById('tabs');
    const counts = {};
    items.forEach(it=>counts[it.category]=(counts[it.category]||0)+1);
    let html = `<div class="tab ${activeCat==='all'?'active':''}" data-cat="all">All (${items.length})</div>`;
    for(const [key,c] of Object.entries(CATS)){
      html += `<div class="tab ${activeCat===key?'active':''}" data-cat="${key}">${c.emoji} ${c.label} (${counts[key]||0})</div>`;
    }
    const flaggedCount = items.filter(i=>(i.reportCount||0)>=FLAG_THRESHOLD).length;
    if(flaggedCount){
      html += `<div class="tab ${activeCat==='flagged'?'active':''}" data-cat="flagged">⚠️ Flagged (${flaggedCount})</div>`;
    }
    tabsEl.innerHTML = html;
    tabsEl.querySelectorAll('.tab').forEach(t=>{
      t.onclick = ()=>{ activeCat = t.dataset.cat; render(); };
    });
  }

  function buildFilters(){
    const dealerSel = document.getElementById('dealerSel');
    const sizeSel = document.getElementById('sizeSel');
    const curDealer = dealerSel.value;
    const curSize = sizeSel.value;

    const dealerCounts = {};
    items.forEach(it=>{
      const key = (it.seller && it.seller.trim()) || it.phone || it.tglink;
      if(!key) return;
      dealerCounts[key] = dealerCounts[key] || {count:0, label: it.seller && it.seller.trim() ? it.seller.trim() : (it.phone || it.tglink)};
      dealerCounts[key].count++;
    });
    let dealerHtml = `<option value="all">Dealer: All</option>`;
    Object.entries(dealerCounts)
      .sort((a,b)=>b[1].count-a[1].count)
      .forEach(([key,v])=>{
        dealerHtml += `<option value="${escapeHtml(key)}">${v.count>=2?'🔥 ':''}${escapeHtml(v.label)} (${v.count})</option>`;
      });
    dealerSel.innerHTML = dealerHtml;
    if([...dealerSel.options].some(o=>o.value===curDealer)) dealerSel.value = curDealer;

    const sizes = [...new Set(items.map(i=>i.size).filter(Boolean))].sort();
    let sizeHtml = `<option value="all">Size: All</option>`;
    sizes.forEach(s=> sizeHtml += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    sizeSel.innerHTML = sizeHtml;
    if([...sizeSel.options].some(o=>o.value===curSize)) sizeSel.value = curSize;
  }

  function updateStats(){
    const now = Date.now();
    const today = items.filter(i => now - i.ts < 86400000).length;
    document.getElementById('statsRow').textContent =
      `📌 ${items.length} pinned overall · ⚡ ${today} in the last 24h`;
  }

  function render(){
    buildTabs();
    buildFilters();
    updateStats();
    const q = document.getElementById('search').value.trim().toLowerCase();
    const sortBy = document.getElementById('sortSel').value;
    const dealerFilter = document.getElementById('dealerSel').value;
    const sizeFilter = document.getElementById('sizeSel').value;
    const grid = document.getElementById('grid');

    let list = items.slice();
    if(activeCat==='flagged') list = list.filter(i=>(i.reportCount||0)>=FLAG_THRESHOLD);
    else if(activeCat!=='all') list = list.filter(i=>i.category===activeCat);
    if(q) list = list.filter(i => (i.title+' '+i.desc).toLowerCase().includes(q));
    if(dealerFilter!=='all') list = list.filter(i => ((i.seller && i.seller.trim()) || i.phone || i.tglink) === dealerFilter);
    if(sizeFilter!=='all') list = list.filter(i => i.size === sizeFilter);

    if(sortBy==='featured'){
      list.sort((a,b)=> (b.featured?1:0)-(a.featured?1:0) || b.ts-a.ts);
    }else if(sortBy==='price-desc'){
      list.sort((a,b)=> (b.price ?? -1) - (a.price ?? -1));
    }else if(sortBy==='price-asc'){
      list.sort((a,b)=>{
        const ap = a.price===undefined||a.price===''?Infinity:a.price;
        const bp = b.price===undefined||b.price===''?Infinity:b.price;
        return ap-bp;
      });
    }else if(sortBy==='az'){
      list.sort((a,b)=> a.title.localeCompare(b.title));
    }else{
      list.sort((a,b)=>b.ts-a.ts);
    }

    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';

    grid.innerHTML = list.map(it=>{
      const cat = CATS[it.category] || CATS.other;
      const isMine = mine.includes(it.id);
      const isFlagged = (it.reportCount||0) >= FLAG_THRESHOLD;
      const alreadyReported = reported.includes(it.id);

      let actions = '';
      if(it.tglink){
        actions += `<a class="a-tg" target="_blank" href="${it.tglink}">Telegram</a>`;
      }
      if(it.phone){
        actions += `<a class="a-wa" target="_blank" href="${whatsappLink(it.phone)}">WhatsApp</a>`;
        actions += `<a class="a-call" href="tel:${it.phone}">Call</a>`;
      }

      actions += `<button class="a-report ${alreadyReported?'reported':''}" ${alreadyReported?'disabled':''} data-action="report" data-id="${it.id}">${alreadyReported?'Reported':'Report'}</button>`;
      if(isAdmin){
        actions += `<button class="a-feature ${it.featured?'on':''}" data-action="feature" data-id="${it.id}">${it.featured?'★ Featured':'☆ Feature'}</button>`;
      }
      if(isMine || isAdmin){
        actions += `<button class="a-del" data-action="delete" data-id="${it.id}">Delete</button>`;
      }
      const img = (it.images && it.images[0]) ? `<img class="attach" src="${it.images[0]}">` : '';
      const flagBadge = isFlagged ? `<span class="flag-badge">⚠️ ${it.reportCount} reports</span>` : '';
      const featuredBadge = it.featured ? `<span class="featured-badge">★ Featured</span>` : '';

      let tags = '';
      if(it.price!==undefined && it.price!=='') tags += `<span class="tag price">₹${it.price}</span>`;
      if(it.size) tags += `<span class="tag">${escapeHtml(it.size)}</span>`;
      if(it.seller) tags += `<span class="tag seller">${escapeHtml(it.seller)}</span>`;
      const tagRow = tags ? `<div class="tag-row">${tags}</div>` : '';

      return `<div class="card" id="card-${it.id}">
        ${flagBadge}${featuredBadge}
        <span class="tape" style="background:${cat.color}">${cat.emoji} ${cat.label}</span>
        <h4>${escapeHtml(it.title)}</h4>
        ${tagRow}
        ${img}
        <p class="desc">${escapeHtml(it.desc)}</p>
        <div class="meta"><span>${timeAgo(it.ts)}</span><span>${it.phone ? '📞 '+it.phone : (it.tglink ? '✈️ Telegram' : '')}</span></div>
        <div class="actions">${actions}</div>
      </div>`;
    }).join('');
  }

  // Handle Dynamic Button Clicks inside Cards
  document.getElementById('grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if (action === 'delete') {
      if (!confirm('Remove this post permanently?')) return;
      try {
        await deleteDoc(doc(db, "items", id));
        mine = mine.filter(m => m !== id);
        localStorage.setItem('my_posted_ids_v1', JSON.stringify(mine));
        toast('Removed from Database');
      } catch (err) {
        toast('Failed to delete item');
      }
    } else if (action === 'report') {
      if (reported.includes(id)) return;
      try {
        await updateDoc(doc(db, "items", id), { reportCount: increment(1) });
        reported.push(id);
        localStorage.setItem('reported_ids_v1', JSON.stringify(reported));
        toast('Report recorded');
      } catch (err) {
        toast('Could not report');
      }
    } else if (action === 'feature') {
      const item = items.find(i => i.id === id);
      if (!item) return;
      try {
        await updateDoc(doc(db, "items", id), { featured: !item.featured });
        toast('Featured state updated');
      } catch (err) {
        toast('Failed to update feature state');
      }
    }
  });

  // Pin Post to Firestore
  document.getElementById('postBtn').onclick = async () => {
    const raw = document.getElementById('rawMsg').value.trim();
    const title = document.getElementById('title').value.trim() || raw.split('\n')[0].slice(0,60) || 'Untitled post';
    let phone = document.getElementById('phone').value.trim();
    let tglink = document.getElementById('tglink').value.trim();
    const category = document.getElementById('category').value;
    const priceRaw = document.getElementById('price').value.trim();
    const price = priceRaw === '' ? undefined : Number(priceRaw);
    const size = document.getElementById('size').value.trim();
    const seller = document.getElementById('seller').value.trim();

    if (!raw && !title) { toast('Paste a message or add a title first'); return; }

    // Format Telegram Username or Redirect Phone Number to WhatsApp
    if (tglink) {
      let cleanTg = tglink.trim().replace(/^@/, '');

      if (/^\+?\d{10,15}$/.test(cleanTg.replace(/[\s-]/g, ''))) {
        let cleanPhone = cleanTg.replace(/\D/g, '');
        if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;
        if (!phone) phone = cleanPhone;
        tglink = ''; 
      } else if (!cleanTg.startsWith('http')) {
        tglink = `https://t.me/${cleanTg}`;
      }
    }

    if (!phone && !tglink) { toast('Provide either a Telegram handle or Phone number'); return; }

    const postBtn = document.getElementById('postBtn');
    postBtn.disabled = true;
    postBtn.textContent = "Pinning...";

    const payload = {
      category, title, desc: raw, phone, tglink, size, seller,
      featured: false,
      reportCount: 0,
      images: pendingImages.slice(),
      ts: Date.now()
    };
    if (price !== undefined) payload.price = price;

    try {
      const docRef = await addDoc(itemsCollection, payload);
      mine.push(docRef.id);
      localStorage.setItem('my_posted_ids_v1', JSON.stringify(mine));
      toast('📌 Pinned to live board!');
      document.getElementById('panel').classList.remove('open');
      resetForm();
    } catch (err) {
      console.error(err);
      toast('Firebase Error: Could not save');
    } finally {
      postBtn.disabled = false;
      postBtn.textContent = "Pin it";
    }
  };

  // Form utilities
  function resetForm(){
    document.getElementById('rawMsg').value='';
    document.getElementById('title').value='';
    document.getElementById('phone').value='';
    document.getElementById('tglink').value='';
    document.getElementById('price').value='';
    document.getElementById('size').value='';
    document.getElementById('seller').value='';
    pendingImages = [];
    document.getElementById('imgPreview').innerHTML = '';
  }

  document.getElementById('toggleBtn').onclick = () => document.getElementById('panel').classList.add('open');
  document.getElementById('cancelBtn').onclick = () => {
    document.getElementById('panel').classList.remove('open');
    resetForm();
  };

  document.getElementById('adminLink').onclick = () => {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('adminLink').textContent = 'Admin';
      toast('Admin mode off');
      render();
      return;
    }
    const code = prompt('Admin passcode:');
    if (code === ADMIN_CODE) {
      isAdmin = true;
      document.getElementById('adminLink').textContent = 'Admin mode: ON';
      toast('Admin mode ON');
      render();
    } else if (code !== null) {
      toast('Wrong passcode');
    }
  };

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('sortSel').addEventListener('change', render);
  document.getElementById('dealerSel').addEventListener('change', render);
  document.getElementById('sizeSel').addEventListener('change', render);
      // Check if AT LEAST ONE contact option is provided
    if (!phone && !tglink) { 
      toast('Please enter a Telegram handle OR a Phone number!'); 
      return; 
    }

</script>
